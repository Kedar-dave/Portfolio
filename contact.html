<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Kedar Dave</title>
    <link rel="stylesheet" href="css/styles.css?v=15">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- Navigation -->
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <!-- Contact Section -->
        <section class="contact-container">
            <!-- Standardized Section Title -->
            <div class="section-title">Let's Connect</div>
            <p style="color: var(--text-secondary); margin-bottom: 40px;">
                Have a project in mind or just want to chat about AI? Drop me a message below.
            </p>

            <form id="contact-form" class="contact-form">
                <!-- Honeypot Field (Hidden) -->
                <div style="display: none;">
                    <label for="honeypot">Leave this field blank</label>
                    <input type="text" id="honeypot" name="honeypot">
                </div>

                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-input" placeholder="Your Name" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-input" placeholder="Your Email" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Subject</label>
                    <input type="text" name="subject" class="form-input" placeholder="Discussion Topic">
                </div>

                <div class="form-group">
                    <label class="form-label">Message</label>
                    <textarea name="message" class="form-textarea" placeholder="How can we collaborate?"
                        required></textarea>
                </div>

                <button type="submit" class="btn"
                    style="width: 100%; justify-content: center; background: var(--text-primary); color: white; border: none;">
                    <i class="fas fa-paper-plane"></i> Send Message
                </button>
                <p id="form-status" style="margin-top: 10px; display: none;"></p>
            </form>

            <div style="text-align: center; margin-top: 32px;">
                <p style="color: var(--text-secondary); font-size: 0.9rem;">
                    Or email directly at <a href="mailto:kedardave2909@gmail.com"
                        style="color: var(--accent-primary); text-decoration: none; font-weight: 500;">kedardave2909@gmail.com</a>
                </p>
            </div>
        </section>

    </div> <!-- End Container -->

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function () {
            emailjs.init({
                publicKey: "DHGP03ea9ozV-BfSo",
            });
        })();

        document.getElementById('contact-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const honeypot = document.getElementById('honeypot').value;
            if (honeypot) return;

            const status = document.getElementById('form-status');
            status.style.display = 'block';
            status.style.color = 'var(--text-secondary)';
            status.innerHTML = 'Sending...';

            const formData = new FormData(this);
            const templateParams = {
                name: formData.get('name').replace(/</g, "&lt;").replace(/>/g, "&gt;"),
                email: formData.get('email').replace(/</g, "&lt;").replace(/>/g, "&gt;"),
                subject: formData.get('subject') ? formData.get('subject').replace(/</g, "&lt;").replace(/>/g, "&gt;") : "No Subject",
                message: formData.get('message').replace(/</g, "&lt;").replace(/>/g, "&gt;")
            };

            emailjs.send('service_n1jzzuk', 'template_x2ymntu', templateParams)
                .then(function () {
                    status.style.color = 'green';
                    status.innerHTML = 'Message sent successfully!';
                    document.getElementById('contact-form').reset();
                }, function () {
                    status.style.color = 'red';
                    status.innerHTML = 'Failed to send message. Please try again later.';
                });
        });
    </script>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <div class="footer-name">Kedar Dave</div>
                    <div class="footer-tagline">Building the bridge between Human & Machine.</div>
                </div>

                <div class="footer-links">
                    <a href="index.html" class="footer-link">Home</a>
                    <a href="https://github.com/Kedar-dave" target="_blank" class="footer-link">GitHub</a>
                    <a href="https://www.linkedin.com/in/kd29/" target="_blank" class="footer-link">LinkedIn</a>
                </div>
            </div>

            <div class="footer-bottom">
                &copy; 2025 Kedar Dave. All rights reserved.
            </div>
        </div>
    </footer>

</body>

</html>
